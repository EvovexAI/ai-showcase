<style>
  :root{
    --bg:#f4f6fb; --panel:#ffffff; --panel2:#f8fafc; --line:#e2e8f0;

  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6}
  .wrap{max-width:1280px;margin:0 auto;padding:32px 24px 64px}

  header.hero{margin-bottom:28px}
  .hero h1{font-size:26px;font-weight:700;letter-spacing:.5px}
  .hero h1 .accent{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p.sub{color:var(--sub);margin-top:6px;font-size:13px}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:28px}
  .stat-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
  .stat-card .num{font-size:26px;font-weight:700;color:var(--acc)}
  .stat-card .label{color:var(--sub);font-size:12px;margin-top:2px}
  .stat-card.breakdown .num{font-size:15px;color:var(--txt);line-height:1.5}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px}
  .toolbar input[type=search]{
    flex:1;min-width:220px;background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:9px 14px;color:var(--txt);outline:none;font-size:13px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
  .toolbar input:focus{border-color:var(--acc)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:5px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);
    color:var(--sub);cursor:pointer;font-size:12px;transition:.15s;user-select:none}
  .chip:hover{border-color:var(--acc);color:var(--acc)}
  .chip.active{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}

  .view-toggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
  .view-toggle button{background:transparent;border:none;color:var(--sub);padding:8px 14px;cursor:pointer;font-size:12px}
  .view-toggle button.active{background:var(--acc2);color:#fff}

  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
  .proj-card{background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:20px;transition:border-color .2s,box-shadow .2s,transform .2s;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
  .proj-card:hover{border-color:rgba(2,132,199,.45);transform:translateY(-2px);box-shadow:0 6px 18px rgba(2,132,199,.10)}
  .proj-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .proj-title{font-size:16px;font-weight:700}
  .proj-id{font-size:11px;color:var(--mut);font-family:Consolas,monospace}
  .lang-badge{padding:2px 10px;border-radius:6px;font-size:11px;font-weight:600;white-space:nowrap;flex-shrink:0}
  .lang-JavaScript{background:#fef3c7;color:#b45309;border:1px solid #fde68a}
  .lang-TypeScript{background:#dbeafe;color:#1d4ed8;border:1px solid #bfdbfe}
  .lang-Python{background:#d1fae5;color:#047857;border:1px solid #a7f3d0}
  .proj-desc{color:var(--sub);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .proj-tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{padding:2px 10px;border-radius:999px;font-size:11px;background:#eef2ff;color:#4f46e5;border:1px solid #e0e7ff}
  .tag.star{background:#ecfdf5;color:var(--ok);border-color:#d1fae5}
  .proj-meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12px;border-top:1px dashed var(--line);padding-top:10px}
  .proj-meta .k{color:var(--mut);white-space:nowrap}
  .proj-meta .v{color:var(--txt);word-break:break-all}
  .proj-meta .v code{background:#f0f9ff;color:var(--acc);padding:1px 6px;border-radius:4px;font-family:Consolas,monospace;font-size:11.5px}

  .evo-section{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:6px}
  .evo-row{display:flex;align-items:center;gap:8px;font-size:12px;flex-wrap:wrap}
  .evo-label{color:var(--mut);font-size:11px;min-width:52px}
  .evo-pill{padding:1px 9px;border-radius:5px;font-size:11px;background:#f0f9ff;color:#0369a1;border:1px solid #e0f2fe}
  .evo-pill.emp{background:#ecfdf5;color:#047857;border-color:#d1fae5}
  .evo-pill.skill{background:#fffbeb;color:#b45309;border-color:#fef3c7}
  .evo-pill.ext{background:#eef2ff;color:#4f46e5;border-color:#e0e7ff}
  .evo-none{color:var(--mut);font-size:11px}

  /* 表格视图 */
  .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:0 1px 3px rgba(15,23,42,.05)}
  table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:1050px}
  thead th{background:var(--panel2);color:var(--sub);text-align:left;padding:11px 14px;font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
  tbody td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
  tbody tr:hover{background:rgba(2,132,199,.05)}
  tbody tr:last-child td{border-bottom:none}
  td .name{font-weight:600;color:var(--txt)}
  td .dir{font-size:11px;color:var(--mut);font-family:Consolas,monospace}
  .table-hidden{display:none}

  footer.notes{margin-top:28px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px}
  footer.notes h3{font-size:13px;color:var(--sub);margin-bottom:8px}
  footer.notes li{color:var(--mut);font-size:12px;margin-left:18px}
  .empty-tip{text-align:center;color:var(--mut);padding:48px 0;display:none}
</style>
</head>

        "市场洞察"
      ],
      "language": "JavaScript",
      "techStack": [

        "8790 API"
      ],
      "status": "可用（全网洞察开箱可用；生图/生视频需安装并登录 BOLI CLI）",
      "evo": {

        "employees": [],

      },

      "source": "README + package.json + server/index.js + vite.config.js + 目录实况（2026-10-25 收录）"
    },
    {
      "category": "kit",
      "id": "kit",
      "dir": "evoflow-onboarding-kit",
      "name": "EvoFlow 项目接入套件",
      "description": "把 ai-showcase 任意工具型项目接入 EvoFlow 全链路的通用操作体系：UI 扩展面板 → 知识库 → 技能库 → 专属员工，四个脚本一条龙（注册扩展/同步知识库/雇佣员工），已在 1004、1005 打样。",
      "tags": [
        "基础设施",
        "EvoFlow 生态",
        "自动化接入"
      ],
      "language": "JavaScript",
      "techStack": [
        "Node 零依赖脚本",
        "manifest 模板",
        "平台 API 打通"
      ],
      "resourceType": "接入套件",
      "launch": "node scripts/register-extension.js / sync-kb.js / hire-employee.js",
      "ports": [],
      "status": "可用",
      "evo": {
        "knowledgeBases": [],
        "employees": [],
        "skills": [
          "evoflow-onboarding (SKILL.md 已注册平台技能)"
        ],
        "extensions": []
      },
      "contains": "SKILL.md、scripts/ 3 个脚本、configs/employee.example.json、templates/extension 模板",
      "source": "README + 目录结构"
    }
  ],
  "notes": [
    "重复/临时项已移至同级 ../_ai-showcase-archive/",
    "2026-10-28 仓库重组：目录改为 <分类>/<意义名>（ecommerce/self-media/productivity/aigc），原 10xx 编号前缀废弃；id 改用语义 slug",
    "douyin-video-pipeline = 内容拆解；aigc-prompt-reverse = AIGC 反推（从前者复制拆出，勿再把反推做进拆解台 UI）",
    "端口分配：8899 / 8765 / 8766 / 8768 / 8769 / 8787 / 8877 / 3001-3002，互不冲突",
    "smart-coach = 学员智能陪练（面板展示；梳/练/答在员工侧）"
  ]
};

// ===== 渲染逻辑 =====

// 统计卡
document.getElementById('gen-at').textContent =
  `${DATA.source} · 生成于 ${DATA.generatedAt} · 共 ${DATA.stats.projects} 个项目`;

const sg = document.getElementById('stat-grid');
const langItems = Object.entries(DATA.stats.byLanguage).map(([k,v])=>`${k}×${v}`).join(' · ');
const typeItems = Object.entries(DATA.stats.byResourceType).map(([k,v])=>`${k}×${v}`).join(' · ');
const evo = DATA.stats.evoTotal;
sg.innerHTML = `
  <div class="stat-card"><div class="num">${DATA.stats.projects}</div><div class="label">项目总数</div></div>
  <div class="stat-card breakdown"><div class="num">${langItems}</div><div class="label">语言分布</div></div>
  <div class="stat-card breakdown"><div class="num">${typeItems}</div><div class="label">资源类型</div></div>
  <div class="stat-card breakdown"><div class="num">知识库 ${evo.knowledgeBases} · 员工 ${evo.employees}</div><div class="label">EvoFlow 资产</div></div>
  <div class="stat-card breakdown"><div class="num">技能 ${evo.skills} · 扩展 ${evo.extensions}</div><div class="label">EvoFlow 资产</div></div>`;

// 语言筛选 chips
const langs = [...new Set(DATA.projects.map(p=>p.language))];
const chipBox = document.getElementById('lang-chips');
chipBox.innerHTML = `<span class="chip active" data-lang="">全部</span>` +
  langs.map(l=>`<span class="chip" data-lang="${l}">${l}</span>`).join('');
let activeLang = '';
chipBox.addEventListener('click', e=>{
  const c = e.target.closest('.chip'); if(!c) return;
  activeLang = c.dataset.lang;
  chipBox.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active', x===c));
  render();
});

// 视图切换
let view = 'cards';
document.getElementById('v-cards').onclick = ()=>{ view='cards'; syncToggle(); render(); };
document.getElementById('v-table').onclick = ()=>{ view='table'; syncToggle(); render(); };
function syncToggle(){
  document.getElementById('v-cards').classList.toggle('active', view==='cards');
  document.getElementById('v-table').classList.toggle('active', view==='table');
}

// 过滤
let query = '';
document.getElementById('q').addEventListener('input', e=>{ query=e.target.value.trim().toLowerCase(); render(); });
function match(p){
  if(activeLang && p.language!==activeLang) return false;
  if(!query) return true;
  return [p.name,p.dir,p.description,(p.tags||[]).join(' '),p.resourceType,p.language]
    .join(' ').toLowerCase().includes(query);
}

// EvoFlow 资产行
function evoRow(label, items, cls){
  const pill = cls || '';
  if(!items || !items.length) return `<div class="evo-row"><span class="evo-label">${label}</span><span class="evo-none">—</span></div>`;
  return `<div class="evo-row"><span class="evo-label">${label}</span>` +
    items.map(i=>`<span class="evo-pill ${pill}">${i}</span>`).join('') + `</div>`;
}

// 卡片渲染
function renderCards(list){
  return list.map(p=>`
  <article class="proj-card">
    <div class="proj-head">
      <div>
        <div class="proj-id">${p.id} · ${p.dir}</div>
        <div class="proj-title">${p.name}</div>
      </div>
      <span class="lang-badge lang-${p.language}">${p.language}</span>
    </div>
    <p class="proj-desc" title="${p.description}">${p.description}</p>
    <div class="proj-tags">
      ${(p.tags||[]).map((t,i)=>`<span class="tag ${i===0?'star':''}">${t}</span>`).join('')}
    </div>
    <div class="proj-meta">
      <span class="k">类型</span><span class="v">${p.resourceType}</span>
      <span class="k">技术栈</span><span class="v">${(p.techStack||[]).join(' / ')}</span>
      <span class="k">启动</span><span class="v"><code>${p.launch||'—'}</code></span>
      <span class="k">状态</span><span class="v">${p.status||'—'}</span>
    </div>
    <div class="evo-section">
      ${evoRow('知识库', p.evo&&p.evo.knowledgeBases)}
      ${evoRow('AI 员工', p.evo&&p.evo.employees, 'emp')}
      ${evoRow('技　能', p.evo&&p.evo.skills, 'skill')}
      ${evoRow('扩展', p.evo&&p.evo.extensions, 'ext')}
    </div>
    <div style="font-size:11px;color:var(--mut)">内容：${p.contains||'—'}</div>
  </article>`).join('');
}

// 表格渲染
function renderTable(list){
  return `<table>
    <thead><tr>
      <th>项目</th><th>标签</th><th>语言</th><th>类型</th><th>技术栈</th>
      <th>知识库</th><th>AI 员工</th><th>技能</th><th>状态</th>
    </tr></thead>
    <tbody>
    ${list.map(p=>`<tr>
      <td><div class="name">${p.name}</div><div class="dir">${p.id} · ${p.dir}</div></td>
      <td>${(p.tags||[]).map(t=>`<span class="tag">${t}</span>`).join(' ')}</td>
      <td><span class="lang-badge lang-${p.language}">${p.language}</span></td>
      <td>${p.resourceType}</td>
      <td style="max-width:180px;font-size:11.5px;color:var(--sub)">${(p.techStack||[]).join(' / ')}</td>
      <td>${(p.evo&&p.evo.knowledgeBases||[]).join('<br>')||'—'}</td>
      <td>${(p.evo&&p.evo.employees||[]).join('<br>')||'—'}</td>
      <td>${(p.evo&&p.evo.skills||[]).join('<br>')||'—'}</td>
      <td style="font-size:11.5px;color:var(--sub)">${p.status||'—'}</td>
    </tr>`).join('')}
    </tbody></table>`;
}

function render(){
  const list = DATA.projects.filter(match);
  document.getElementById('cards').innerHTML = renderCards(list);
  document.getElementById('table-view').innerHTML = renderTable(list);
  document.getElementById('cards').classList.toggle('table-hidden', view!=='cards');
  document.getElementById('table-view').classList.toggle('table-hidden', view!=='table');
  document.getElementById('empty').style.display = list.length ? 'none':'block';
}

document.getElementById('notes-list').innerHTML =
  DATA.notes.map(n=>`<li>${n}</li>`).join('');
render();
</script>
</body>
</html>
