[project]
name = "ai-video-promo"
version = "0.1.0"
description = "宣传视频制作系统 - Promo Video Production System (TTS, storyboard plans, workbench)"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.promo-server]
host = "127.0.0.1"
port = 8766
entry = "scripts.promo_server:main"
