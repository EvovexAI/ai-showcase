<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>海报编辑器</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
  <!-- 顶部工具栏 -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-logo">🎨</span>
      <span class="brand-name">海报编辑器</span>
    </div>

    <div class="topbar-tools">
      <button class="tool-btn" id="btnAiGen"><svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>AI 背景</button>
      <button class="tool-btn" id="btnBg">
        <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        背景
      </button>
      <button class="tool-btn" id="btnText">
        <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 4 18 4"/><line x1="12" y1="4" x2="12" y2="20"/><path d="M8 20h8"/></svg>
        文字
      </button>
      <button class="tool-btn" id="btnImage">
        <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
        图片
      </button>
      <button class="tool-btn" id="btnAiImage">
        <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>
        AI 图片
      </button>
      <button class="tool-btn" id="btnAiOptimize">
        <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        AI 优化
      </button>
      <button class="tool-btn tool-btn--primary" id="btnAiPoster">🤖 一键生成</button>
    </div>

    <div class="topbar-actions">
      <button class="tool-btn tool-btn--sm" id="btnUndo" title="撤销 (Ctrl+Z)" disabled>↩</button>
      <button class="tool-btn tool-btn--sm" id="btnRedo" title="重做 (Ctrl+Y)" disabled>↪</button>
      <button class="tool-btn tool-btn--sm" id="btnImportLayout" title="导入布局">导入布局</button>
      <button class="tool-btn tool-btn--sm" id="btnExportLayout" title="导出布局">导出布局</button>
      <button class="tool-btn tool-btn--settings" id="btnSettings" title="设置">⚙</button>
      <button class="tool-btn tool-btn--primary" id="btnExport"><span class="tool-icon">💾</span>导出</button>
    </div>
  </header>

  <!-- 工作区 -->
  <main class="workspace">
    <!-- 画布舞台 -->
    <section class="stage" id="canvasWrapper">
      <div class="stage-inner">
        <div class="canvas" id="canvas">
          <div class="canvas-empty" id="canvasEmpty">
            <svg class="canvas-empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/><path d="M12 8v4"/><path d="M10 10h4"/></svg>
            <div class="canvas-empty-text">点击顶部「背景」上传图片开始</div>
          </div>
        </div>
      </div>

      <!-- 缩放工具条 -->
      <div class="zoom-bar">
        <button class="zoom-btn" id="zoomOut" title="缩小">−</button>
        <button class="zoom-btn zoom-value" id="zoomValue" title="重置为 100%">100%</button>
        <button class="zoom-btn" id="zoomIn" title="放大">+</button>
        <span class="zoom-sep"></span>
        <button class="zoom-btn" id="zoomFit" title="适应窗口">⤢</button>
      </div>
    </section>

    <!-- 右侧属性栏（常驻） -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">属性</span>
        <button class="icon-btn" id="panelClose" title="取消选择">✕</button>
      </div>

      <div class="sidebar-body">
        <!-- 空状态 -->
        <div class="empty-state" id="emptyState">
          <div class="empty-state-icon">🎨</div>
          <p>选中画布中的元素<br>来编辑属性</p>
        </div>

        <!-- 属性容器 -->
        <div class="props" id="propsContainer" style="display:none;">
          <!-- 操作 -->
          <div class="prop-group">
            <div class="prop-group-title">层级</div>
            <div class="prop-row prop-row--btns">
              <button class="prop-btn" id="btnFront" title="置顶">⏫ 置顶</button>
              <button class="prop-btn" id="btnUp" title="上移一层">⬆</button>
              <button class="prop-btn" id="btnDown" title="下移一层">⬇</button>
              <button class="prop-btn" id="btnBack" title="置底">⏬ 置底</button>
            </div>
            <div class="prop-row">
              <button class="prop-btn prop-btn--danger" id="btnDelete">🗑 删除元素</button>
            </div>
          </div>

          <!-- 图片属性 -->
          <div class="prop-group" id="imageProps" style="display:none;">
            <div class="prop-group-title">图片</div>
            <div class="prop-row prop-row--info">
              <label>ID</label>
              <span class="prop-val prop-val--mono" id="imgIdVal">-</span>
            </div>
          </div>

          <!-- 文字属性 -->
          <div class="prop-group" id="textProps" style="display:none;">
            <div class="prop-group-title">文字</div>

            <div class="prop-row">
              <label>ID</label>
              <span class="prop-val prop-val--mono" id="textIdVal">-</span>
            </div>

            <div class="prop-row">
              <label>宽 × 高</label>
              <div style="display:flex;gap:4px;align-items:center;">
                <input type="number" id="propWidth" min="20" max="2000" style="width:60px;" title="宽度(px)">
                <span style="color:var(--text-faint);">×</span>
                <input type="number" id="propHeight" min="20" max="2000" style="width:60px;" title="高度(px)">
              </div>
            </div>

            <div class="prop-row">
              <label>旋转</label>
              <input type="range" id="propAngle" min="0" max="360" value="0" step="1">
              <span class="prop-val" id="angleVal" style="min-width:30px;">0°</span>
            </div>

            <div class="prop-row">
              <label>颜色</label>
              <input type="color" id="propColor" value="#000000">
              <span class="prop-val" id="colorVal">#000000</span>
            </div>

            <div class="prop-row">
              <label>背景色</label>
              <input type="color" id="propBgColor" value="#ffff00">
              <input type="range" id="propBgOpacity" min="0" max="100" value="0" style="flex:0.5;">
              <span class="prop-val" id="bgOpacityVal" style="min-width:22px;">0</span>
            </div>

            <div class="prop-row">
              <label>字号</label>
              <input type="range" id="propFontSize" min="12" max="120" value="24">
              <span class="prop-val" id="fontSizeVal">24</span>
            </div>

            <div class="prop-row">
              <label>字体</label>
              <select id="propFont">
                <!-- 字体选项由 JS 动态生成 -->
              </select>
            </div>

            <div class="prop-row">
              <label>行距</label>
              <input type="range" id="propLineHeight" min="10" max="30" value="0" step="1">
              <span class="prop-val" id="lineHeightVal" style="min-width:22px;">0</span>
            </div>

            <div class="prop-row">
              <label>字距</label>
              <input type="range" id="propLetterSpacing" min="0" max="20" value="0" step="1">
              <span class="prop-val" id="letterSpacingVal" style="min-width:22px;">0</span>
            </div>

            <div class="prop-row">
              <label>样式</label>
              <div class="btn-group">
                <button class="style-btn" id="btnBold" title="加粗"><b>B</b></button>
                <button class="style-btn" id="btnItalic" title="斜体"><i>I</i></button>
                <button class="style-btn" id="btnUnderline" title="下划线"><u>U</u></button>
                <button class="style-btn" id="btnStrikethrough" title="删除线"><s>S</s></button>
                <button class="style-btn" id="btnFlip" title="水平翻转">⇔</button>
                <button class="style-btn" id="btnAlignLeft" title="左对齐">≡</button>
                <button class="style-btn" id="btnAlignCenter" title="居中">☰</button>
                <button class="style-btn" id="btnAlignRight" title="右对齐">≡</button>
              </div>
            </div>

            <div class="prop-row">
              <label>透明度</label>
              <input type="range" id="propOpacity" min="0" max="100" value="100">
              <span class="prop-val" id="opacityVal">100</span>
            </div>
          </div>

          <!-- 艺术效果 -->
          <div class="prop-group" id="artProps" style="display:none;">
            <div class="prop-group-title">艺术效果</div>

            <!-- 阴影 -->
            <div class="prop-row art-toggle-row">
              <input type="checkbox" id="propShadow">
              <label for="propShadow">阴影</label>
            </div>
            <div class="prop-sub" id="shadowOptions" style="display:none;">
              <div class="art-sub-row">
                <input type="number" id="shadowX" value="2" min="-20" max="20" title="X偏移">
                <input type="number" id="shadowY" value="2" min="-20" max="20" title="Y偏移">
                <input type="number" id="shadowBlur" value="4" min="0" max="50" title="模糊">
                <input type="color" id="shadowColor" value="#000000" title="颜色">
              </div>
            </div>

            <!-- 描边 -->
            <div class="prop-row art-toggle-row">
              <input type="checkbox" id="propStroke">
              <label for="propStroke">描边</label>
            </div>
            <div class="prop-sub" id="strokeOptions" style="display:none;">
              <div class="art-sub-row">
                <input type="number" id="strokeWidth" value="1" min="0.5" max="10" step="0.5" title="宽度">
                <input type="color" id="strokeColor" value="#ffffff" title="颜色">
              </div>
            </div>

            <!-- 霓虹发光 -->
            <div class="prop-row art-toggle-row">
              <input type="checkbox" id="propGlow">
              <label for="propGlow">霓虹发光</label>
            </div>
            <div class="prop-sub" id="glowOptions" style="display:none;">
              <div class="art-sub-row">
                <input type="color" id="glowColor" value="#00ffff" title="颜色">
                <input type="range" id="glowIntensity" min="1" max="3" value="2" step="0.5" title="强度" style="width:80px;">
              </div>
            </div>

            <!-- 浮雕 -->
            <div class="prop-row art-toggle-row">
              <input type="checkbox" id="propEmboss">
              <label for="propEmboss">浮雕</label>
            </div>
          </div>
        </div>
      </div>
    </aside>
  </main>

  <!-- 导出弹窗 -->
  <div class="modal-overlay" id="exportModal">
    <div class="modal">
      <div class="modal-title">导出海报</div>
      <div class="modal-body">
        <div class="export-options">
          <button class="export-btn" id="exportPng">
            <svg class="export-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span>PNG</span>
            <small>透明背景</small>
          </button>
          <button class="export-btn" id="exportJpg">
            <svg class="export-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
            <span>JPG</span>
            <small>体积更小</small>
          </button>
        </div>
        <div class="export-resolution">
          <label>分辨率</label>
          <select id="exportResolution">
            <option value="2">2x (750×1624)</option>
            <option value="3">3x (1125×2436)</option>
            <option value="4" selected>4x (1500×3248) 推荐</option>
            <option value="5">5x (1875×4060) 超清</option>
          </select>
        </div>
      </div>
      <button class="modal-close" id="exportModalClose">取消</button>
    </div>
  </div>

  <!-- AI 生成背景弹窗 -->
  <div class="modal-overlay" id="aiGenModal">
    <div class="modal modal--ai">
      <button class="modal-close-icon" id="aiGenClose" title="关闭">✕</button>
      <div class="modal-title">✨ AI 生成背景 <span class="ai-provider-badge" id="aiGenProvider"></span></div>
      <div class="modal-body">
        <!-- 参考图 -->
        <div class="ai-ref" id="aiGenRef">
          <div class="ai-ref-list" id="aiRefList"></div>
          <label class="ai-ref-upload" id="aiRefUploadBtn">
            <input type="file" id="aiRefFile" accept="image/*" hidden>
            <svg class="ai-ref-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
            <span id="aiRefUploadLabel">参考图</span>
          </label>
        </div>

        <textarea id="aiGenInput" class="ai-input ai-input--lg" rows="6" placeholder="描述你想要的海报背景，例如：蓝天白云下的海滩，日落时分，色彩温暖"></textarea>
        <button class="ai-btn" id="aiGenBtn">✨ 开始生成</button>

        <!-- 流式文本输出 -->
        <div class="ai-stream" id="aiGenStreamText" style="display:none;"></div>
        <!-- 加载中 -->
        <div class="ai-loading" id="aiGenLoading" style="display:none;">
          <span class="loading-dots"><span></span><span></span><span></span></span>
          <span>AI 正在生成背景图，请稍候…</span>
        </div>
        <!-- 预览 -->
        <div class="ai-preview" id="aiGenPreview" style="display:none;">
          <img id="aiGenPreviewImg" alt="AI 生成预览">
        </div>
      </div>
      <div class="ai-actions">
        <button class="ai-btn ai-btn--confirm" id="aiGenConfirm" style="display:none;">✓ 确认应用</button>
      </div>
    </div>
  </div>

  <!-- 参考图预览弹窗 -->
  <div class="ref-preview-overlay" id="aiRefPreviewModal">
    <button class="ref-preview-close" id="aiRefPreviewClose">✕</button>
    <button class="ref-preview-nav ref-preview-prev" id="aiRefPrev">‹</button>
    <img id="aiRefPreviewImg" alt="参考图预览">
    <button class="ref-preview-nav ref-preview-next" id="aiRefNext">›</button>
    <div class="ref-preview-counter" id="aiRefCounter"></div>
  </div>

  <!-- AI 优化布局弹窗 -->
  <div class="modal-overlay" id="aiOptimizeModal">
    <div class="modal modal--ai">
      <button class="modal-close-icon" id="aiOptimizeClose" title="关闭">✕</button>
      <div class="modal-title">✨ AI 优化布局 <span class="ai-provider-badge" id="aiOptProvider"></span></div>
      <div class="modal-body">
        <div class="ai-opt-preview" id="aiOptPreview">
          <img id="aiOptPreviewImg" alt="当前海报">
        </div>

        <!-- 对话历史 -->
        <div class="ai-opt-conversation" id="aiOptConversation" style="display:none;"></div>

        <!-- 快捷预设 -->
        <div class="ai-opt-presets" id="aiOptPresets">
          <button class="preset-btn" data-prompt="把标题字号加大到 36-48px 并水平居中，副标题字号收小到 20-24px，保持层级分明">🎯 标题优化</button>
          <button class="preset-btn" data-prompt="统一所有元素的垂直间距为 20px，同组元素左对齐，让排版整齐有序">📐 统一间距</button>
          <button class="preset-btn" data-prompt="调整所有图片的尺寸和位置，保持宽高比协调，与邻近文字对齐">🖼️ 图片排版</button>
          <button class="preset-btn" data-prompt="分析背景图主色调，优化所有文字颜色确保对比度，统一暖色或冷色方向">🌈 优化配色</button>
        </div>

        <textarea id="aiOptInput" class="ai-input ai-input--lg" rows="6" placeholder="描述你想要的调整，例如：标题放大到 48px，副标题往上移 20px"></textarea>
        <button class="ai-btn" id="aiOptBtn">✨ 开始优化</button>
        <div class="ai-stream" id="aiOptStreamText" style="display:none;"></div>
        <div class="ai-loading" id="aiOptLoading" style="display:none;">
          <span class="loading-dots"><span></span><span></span><span></span></span>
          <span>AI 正在分析并优化布局…</span>
        </div>
      </div>
      <div class="ai-actions">
        <button class="ai-btn ai-btn--confirm" id="aiOptConfirm" style="display:none;">预览</button>
        <button class="ai-btn ai-btn--undo" id="aiOptUndo" style="display:none;"> 撤回</button>
        <button class="ai-btn ai-btn--reset" id="aiOptReset" style="display:none;" title="重置对话">↺ 重置对话</button>
      </div>
    </div>
  </div>

  <!-- AI 一键生成海报弹窗 -->
  <div class="modal-overlay" id="aiPosterModal">
    <div class="modal modal--ai">
      <div class="modal-header">
        <div class="modal-title">🤖 AI 一键生成海报 <span class="ai-provider-badge" id="aiPosterProvider"></span></div>
        <button class="modal-close-icon" id="aiPosterClose" title="关闭">✕</button>
      </div>
      <div class="modal-body">
        <textarea class="ai-input ai-input--lg" id="aiPosterInput" placeholder="输入海报主题，如：618年中大促、新品发布会、节日祝福、招生海报…"></textarea>
        <!-- 参考图 -->
        <div class="ai-ref" id="aiPosterRef">
          <div class="ai-ref-list" id="aiPosterRefList"></div>
          <label class="ai-ref-upload" id="aiPosterRefUploadBtn">
            <input type="file" id="aiPosterRefFile" accept="image/*" hidden>
            <svg class="ai-ref-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
            <span id="aiPosterRefUploadLabel">参考图</span>
          </label>
        </div>
        <button class="ai-btn" id="aiPosterBtn">✨ 一键生成</button>
        <div class="ai-loading" id="aiPosterLoading" style="display:none;">
          <div class="loading-dots"><span></span><span></span><span></span></div> AI 正在设计海报布局…
        </div>
        <div class="ai-stream" id="aiPosterStreamText" style="display:none;"></div>
        <small style="display:block;margin-top:8px;color:var(--text-faint);">Ctrl+Enter 快速发送</small>
      </div>
    </div>
  </div>

  <!-- AI 生成图片弹窗 -->
  <div class="modal-overlay" id="aiImageModal">
    <div class="modal modal--ai">
      <button class="modal-close-icon" id="aiImageClose" title="关闭">✕</button>
      <div class="modal-title">✨ AI 生成图片 <span class="ai-provider-badge" id="aiImgProvider"></span></div>
      <div class="modal-body">
        <!-- 参考图 -->
        <div class="ai-ref" id="aiImgRef">
          <div class="ai-ref-list" id="aiImgRefList"></div>
          <label class="ai-ref-upload" id="aiImgRefUploadBtn">
            <input type="file" id="aiImgRefFile" accept="image/*" hidden>
            <svg class="ai-ref-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
            <span id="aiImgRefUploadLabel">参考图</span>
          </label>
        </div>

        <textarea id="aiImgInput" class="ai-input ai-input--lg" rows="6" placeholder="描述你想要的图片，例如：一只可爱的卡通猫咪，风格扁平化"></textarea>
        <button class="ai-btn" id="aiImgBtn">✨ 开始生成</button>

        <div class="ai-stream" id="aiImgStreamText" style="display:none;"></div>
        <div class="ai-loading" id="aiImgLoading" style="display:none;">
          <span class="loading-dots"><span></span><span></span><span></span></span>
          <span>AI 正在生成图片，请稍候…</span>
        </div>
        <div class="ai-preview" id="aiImgPreview" style="display:none;">
          <img id="aiImgPreviewImg" alt="AI 生成预览">
          <div class="ai-preview-note">* 绿色背景将在添加时自动抠除</div>
        </div>
      </div>
      <div class="ai-actions">
        <button class="ai-btn ai-btn--confirm" id="aiImgConfirm" style="display:none;">✓ 添加到画布</button>
      </div>
    </div>
  </div>

  <!-- 隐藏的文件输入 -->
  <input type="file" id="fileBg" accept="image/*" hidden>
  <input type="file" id="fileImage" accept="image/*" hidden>
  <!-- 设置弹窗 -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal modal--settings">
      <button class="modal-close-icon" id="settingsClose" title="关闭">✕</button>
      <div class="modal-title">⚙ 设置</div>
      <div class="modal-body">
        <!-- AI 背景 -->
        <div class="settings-section">
          <div class="settings-section-title">🎨 AI 背景生成</div>
          <div class="settings-row"><label>类型</label><select id="setBgType"><option value="tongyi">通义万象</option><option value="newapi">NewAPI</option></select></div>
          <div class="settings-row"><label>API Base</label><input type="text" id="setBgBase"></div>
          <div class="settings-row"><label>API Key</label><input type="password" id="setBgKey"></div>
          <div class="settings-row" id="setBgModelRow"><label>Model</label><input type="text" id="setBgModel"></div>
        </div>

        <!-- AI 图片 -->
        <div class="settings-section">
          <div class="settings-section-title">🖼 AI 图片生成</div>
          <div class="settings-row"><label>类型</label><select id="setImgType"><option value="tongyi">通义万象</option><option value="newapi">NewAPI</option></select></div>
          <div class="settings-row"><label>API Base</label><input type="text" id="setImgBase"></div>
          <div class="settings-row"><label>API Key</label><input type="password" id="setImgKey"></div>
          <div class="settings-row" id="setImgModelRow"><label>Model</label><input type="text" id="setImgModel"></div>
        </div>

        <!-- AI 布局优化 -->
        <div class="settings-section">
          <div class="settings-section-title">📐 AI 布局优化</div>
          <div class="settings-row"><label>类型</label><select id="setOptType"><option value="newapi">NewAPI</option><option value="tongyi">通义万象</option></select></div>
          <div class="settings-row"><label>API Base</label><input type="text" id="setOptBase"></div>
          <div class="settings-row"><label>API Key</label><input type="password" id="setOptKey"></div>
          <div class="settings-row" id="setOptModelRow"><label>Model</label><input type="text" id="setOptModel"></div>
        </div>

        <!-- AI 一键生成海报 -->
        <div class="settings-section">
          <div class="settings-section-title">🤖 AI 一键生成</div>
          <div class="settings-row"><label>类型</label><select id="setPosterType"><option value="newapi">NewAPI</option><option value="tongyi">通义万象</option></select></div>
          <div class="settings-row"><label>API Base</label><input type="text" id="setPosterBase"></div>
          <div class="settings-row"><label>API Key</label><input type="password" id="setPosterKey"></div>
          <div class="settings-row" id="setPosterModelRow"><label>Model</label><input type="text" id="setPosterModel"></div>
        </div>

        <button class="ai-btn ai-btn--cancel" id="btnResetConfig" style="margin-top:8px;">↺ 恢复默认</button>
      </div>
    </div>
  </div>
  <input type="file" id="fileImportLayout" accept=".json" hidden>
